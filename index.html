<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marwan-e | DJ & Producer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <nav>
      <a href="#music">Music</a>
      <a href="#booking">Booking</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="content">
      <h1>Marwan-e</h1>
      <p>Immersive Audio Experience</p>
      <button class="cta-btn" id="play-btn">Enter The Vibe</button>
    </div>

    <section id="music">
      <h2>Latest Drops</h2>
      <div class="track-grid">
        <div class="track-card" data-audio="audio/neon-drift.mp3">
          <div class="track-visual"></div>
          <h3>Neon Drift</h3>
          <button class="play-btn-small">▶</button>
        </div>
        <div class="track-card" data-audio="audio/cyber-glitch.mp3">
          <div class="track-visual"></div>
          <h3>Cyber Glitch</h3>
          <button class="play-btn-small">▶</button>
        </div>
        <div class="track-card" data-audio="audio/night-city.mp3">
          <div class="track-visual"></div>
          <h3>Night City</h3>
          <button class="play-btn-small">▶</button>
        </div>
      </div>
    </section>

    <section id="booking">
      <h2>Book a Session</h2>
      <form>
        <div class="form-group">
          <input type="text" class="form-input" required />
          <label class="form-label">Name</label>
        </div>
        <div class="form-group">
          <input type="email" class="form-input" required />
          <label class="form-label">Email</label>
        </div>
        <button type="submit" class="cta-btn">Send Request</button>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
